name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get-version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Generate AppKeyProvider
        shell: bash
        run: |
          mkdir -p Source/Generated
          cat > Source/Generated/AppKeyProvider.cs << EOF
          namespace TTNOverlay.Generated
          {
              internal static class AppKeyProvider
              {
                  public const string Key = "${{ secrets.TWITCH_CLIENT_ID }}";
              }
          }
          EOF

      - name: Publish app
        run: dotnet publish TTNOverlay.csproj -c Release -o publish -r win-x64 --self-contained true -p:Version=${{ steps.get-version.outputs.version }}

      - name: Create Velopack Release
        run: |
          dotnet tool install -g vpk
          vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          vpk pack -u TTNOverlay -v ${{ steps.get-version.outputs.version }} -p publish -e TTNOverlay.exe --releaseNotes RELEASE_NOTES.md --icon Resources\icon.ico --splashImage Resources\install_splash.gif --packTitle "TTNOverlay"
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish --releaseName "TTNOverlay v${{ steps.get-version.outputs.version }}" --tag ${{ github.ref_name }} --token ${{ secrets.GITHUB_TOKEN }}
